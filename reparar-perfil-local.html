<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reparar perfil local · Conecta Servicios</title>
  <style>body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}main{max-width:440px;background:white;border-radius:28px;padding:26px;box-shadow:0 22px 52px rgba(15,23,42,.16)}h1{margin:0 0 8px;font-size:28px}p{color:#6b7280;line-height:1.45}.status{padding:12px 14px;border-radius:16px;background:#eef2ff;color:#1e3a8a;font-weight:800;margin:14px 0}a,button{width:100%;min-height:52px;border:0;border-radius:999px;display:flex;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#5b2eea,#3b0b9f);color:white;font-weight:900;font-size:16px;margin-top:10px}.secondary{background:#e5e7eb;color:#111827}</style>
</head>
<body>
<main>
  <h1>Reparar perfil local</h1>
  <p>Corrige respaldos locales de perfil dañados en este celular. No toca Supabase ni publicaciones.</p>
  <div class="status" id="status">Listo para reparar.</div>
  <button id="fix">Reparar perfil de este celular</button>
  <a href="/?v=6481&fresh=1">Entrar a la app</a>
</main>
<script>
function safeGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
function fix(){
 const keys=['conecta_profile_backup_v1','cs_profile_backup_v1','cs_v634_profile'];
 let profile=keys.map(safeGet).find(p=>p&&typeof p==='object'&&(p.name||p.avatarData||p.avatar))||{};
 profile={name:String(profile.name||localStorage.getItem('conecta_profile_name_backup')||'Usuario local').trim()||'Usuario local',avatarData:String(profile.avatarData||profile.avatar||localStorage.getItem('conecta_profile_avatar_backup')||'').trim(),updatedAt:new Date().toISOString()};
 keys.forEach(k=>{try{localStorage.setItem(k,JSON.stringify(profile))}catch{}});
 document.getElementById('status').textContent='Perfil local reparado. Entrando a la app...';
 setTimeout(()=>location.replace('/?v=6481&fresh='+Date.now()),900);
}
document.getElementById('fix').onclick=fix;
</script>
</body></html>
