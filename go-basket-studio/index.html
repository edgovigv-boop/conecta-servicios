<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070f" />
  <title>Go Basket Studio Live</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="broadcast-app" id="app">
    <section class="camera-stage" aria-label="Vista de cámara o cancha">
      <div class="court-bg" aria-hidden="true">
        <div class="court-lines"></div>
        <div class="court-noise"></div>
      </div>
    </section>

    <header class="scoreboard-overlay" aria-label="Marcador principal">
      <article class="team-card team-card--a">
        <div class="team-topline"></div>
        <div class="team-main">
          <div class="team-logo team-logo--a" aria-label="Logo equipo A">
            <span>🐺</span>
          </div>
          <div class="team-info">
            <p class="team-label">EQUIPO A</p>
            <strong class="team-score">00</strong>
          </div>
        </div>
        <div class="team-meta">
          <span>Faltas <b>0</b></span>
          <span class="timeout-dots" aria-label="Tiempos fuera equipo A"><i></i><i></i><i class="off"></i></span>
        </div>
      </article>

      <article class="clock-card">
        <p class="live-badge"><span class="live-dot"></span> EN VIVO</p>
        <strong class="game-clock">10:00</strong>
        <span class="period-label">1er Cuarto</span>
      </article>

      <article class="team-card team-card--b">
        <div class="team-topline"></div>
        <div class="team-main team-main--reverse">
          <div class="team-info team-info--right">
            <p class="team-label">EQUIPO B</p>
            <strong class="team-score">00</strong>
          </div>
          <div class="team-logo team-logo--b" aria-label="Logo equipo B">
            <span>🐯</span>
          </div>
        </div>
        <div class="team-meta">
          <span>Faltas <b>0</b></span>
          <span class="timeout-dots timeout-dots--b" aria-label="Tiempos fuera equipo B"><i></i><i></i><i class="off"></i></span>
        </div>
      </article>
    </header>

    <section class="prompt-pill" aria-label="Teleprompter">
      <span class="prompt-icon">✦</span>
      <p><b>Sugerencia:</b> Canasta del número 13, José Luis</p>
      <button class="prompt-next" type="button" aria-label="Siguiente sugerencia">›</button>
    </section>

    <section class="mic-pill" aria-label="Micrófono activo">
      <span class="mic-icon">🎙️</span>
      <span>Micrófono activo</span>
      <div class="audio-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </section>

    <footer class="control-dock" aria-label="Controles del partido">
      <button class="dock-btn dock-btn--wide dock-btn--clock" data-modal="clock" type="button">
        <span class="dock-icon">⏱️</span>
        <strong>Iniciar / Pausa</strong>
        <small>Tiempo fuera</small>
      </button>
      <button class="dock-btn dock-btn--score" data-modal="score" type="button">
        <span class="dock-icon">🏀</span>
        <strong>Anotar punto</strong>
        <small>+1 universal</small>
      </button>
      <button class="dock-btn dock-btn--foul" data-modal="foul" type="button">
        <span class="dock-icon">🚩</span>
        <strong>Faltas</strong>
        <small>Equipo / jugador</small>
      </button>
      <button class="dock-btn dock-btn--tv" data-modal="tv" type="button">
        <span class="dock-icon">📺</span>
        <strong>Transmitir</strong>
        <small>TV / pantalla</small>
      </button>
      <button class="dock-btn dock-btn--settings" data-modal="settings" type="button">
        <span class="dock-icon">⚙️</span>
        <strong>Configuración</strong>
        <small>Datos</small>
      </button>
    </footer>

    <div class="modal-backdrop" id="modalBackdrop" hidden></div>
    <section class="glass-modal" id="glassModal" hidden aria-live="polite">
      <button class="modal-close" id="modalClose" type="button" aria-label="Cerrar">×</button>
      <p class="modal-kicker" id="modalKicker">Go Basket Studio</p>
      <h2 id="modalTitle">Acción</h2>
      <p id="modalText">Aquí irá la acción seleccionada.</p>
      <div class="modal-actions" id="modalActions"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
