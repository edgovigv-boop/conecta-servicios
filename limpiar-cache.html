<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b2eea" />
  <title>Entrar limpio · Conecta Servicios</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}
    main{width:100%;max-width:440px;border-radius:28px;background:white;padding:26px;box-shadow:0 22px 52px rgba(15,23,42,.16)}
    h1{margin:0 0 8px;font-size:28px;line-height:1.1}
    p{margin:0 0 16px;color:#6b7280;line-height:1.45}
    .status{margin:14px 0;padding:12px 14px;border-radius:16px;background:#eef2ff;color:#1e3a8a;font-weight:800}
    a,button{width:100%;min-height:52px;border:0;border-radius:999px;display:flex;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#5b2eea,#3b0b9f);color:white;font-weight:900;font-size:16px;margin-top:10px}
    small{display:block;margin-top:12px;color:#6b7280;line-height:1.35}
  </style>
</head>
<body>
  <main>
    <h1>Conecta Servicios</h1>
    <p>Se corrigió el render para que un paso visual no borre toda la app.</p>
    <div class="status" id="status">Limpiando versión anterior...</div>
    <a href="/?v=6477&fresh=1">Entrar a la app</a>
    <small>Esto no borra Supabase ni publicaciones de la nube.</small>
  </main>
  <script>
    async function clean(){
      try{ if('caches' in window){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); } }catch(e){}
      try{ if('serviceWorker' in navigator){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); } }catch(e){}
      try{ sessionStorage.clear(); }catch(e){}
      document.getElementById('status').textContent='Listo. Entrando a la app...';
      setTimeout(()=>location.replace('/?v=6477&fresh='+Date.now()), 1000);
    }
    clean();
  </script>
</body>
</html>
