<!doctype html><html lang="es"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#1d4ed8" /><title>Entrar limpio · Conecta Servicios</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}main{width:100%;max-width:440px;border-radius:28px;background:white;padding:26px;box-shadow:0 22px 52px rgba(15,23,42,.16)}h1{margin:0 0 8px;font-size:28px;line-height:1.1}p{margin:0 0 16px;color:#6b7280;line-height:1.45}.status{margin:14px 0;padding:12px 14px;border-radius:16px;background:#eef2ff;color:#1e3a8a;font-weight:800}a{width:100%;min-height:52px;border:0;border-radius:999px;display:flex;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#1d4ed8,#312e81);color:white;font-weight:900;font-size:16px;margin-top:10px}</style></head><body><main><h1>Conecta Servicios</h1><p>Se fijó el hilo admin usando dueño real de publicación y usuario real del mensaje.</p><div class="status" id="status">Limpiando versión anterior...</div><a href="/?v=6488&fresh=1">Entrar a la app</a></main><script>async function clean(){try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}}catch(e){}try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}}catch(e){}try{sessionStorage.clear();}catch(e){}document.getElementById('status').textContent='Listo. Entrando a la app...';setTimeout(()=>location.replace('/?v=6488&fresh='+Date.now()),900);}clean();</script></body></html>
