<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b2eea" />
  <meta name="description" content="Conecta Servicios: red local para publicar necesidades, servicios, negocios, mandados, viajes y oportunidades con contacto directo o asistente de publicación." />
  <title>Conecta Servicios v5.2.16</title>
  <link rel="manifest" href="manifest.json?v=5.2.16-publicar-simple" />
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=5.2.16-publicar-simple" />
</head>
<body data-version="v5.2.16-publicar-simple">
  <noscript>Activa JavaScript para usar Conecta Servicios.</noscript>
  <div id="app" class="app-shell"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=5.2.16-publicar-simple" defer></script>
  <script src="investor-demo-fixes.js?v=5.2.16-publicar-simple" defer></script>
  <script>
    (function () {
      'use strict';
      var CARD_ID = 'paypos-fer-profile-access';

      function addPayposAccess() {
        if (!document.body.classList.contains('route-perfil')) return;
        if (document.getElementById(CARD_ID)) return;
        var options = document.querySelector('.big-options');
        if (!options) return;

        var link = document.createElement('a');
        link.id = CARD_ID;
        link.className = 'big-option';
        link.href = '/paypos/whatsapp-excel.html';
        link.setAttribute('aria-label', 'Abrir PayPos Fer');
        link.innerHTML = '<span class="ico">📊</span><div><b>PayPos Fer</b><small>Captura movimientos tipo WhatsApp y conviértelos en tabla para Excel.</small><span style="display:inline-flex;margin-top:8px;color:#5b2eea;font-weight:950">Abrir herramienta</span></div>';
        options.appendChild(link);
      }

      function watchApp() {
        var root = document.getElementById('app');
        if (!root) return;
        addPayposAccess();
        new MutationObserver(addPayposAccess).observe(root, { childList: true, subtree: true });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', watchApp);
      } else {
        watchApp();
      }
    }());
  </script>
</body>
</html>
