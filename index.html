<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Conecta Servicios en pausa</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at top left, rgba(91, 46, 234, 0.16), transparent 36%),
        radial-gradient(circle at bottom right, rgba(22, 163, 74, 0.12), transparent 32%),
        linear-gradient(180deg, #fff7ed, #f8fafc 44%, #eef2ff);
    }

    main {
      width: min(100%, 560px);
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 30px;
      padding: 26px;
      box-shadow: 0 22px 54px rgba(15, 23, 42, 0.14);
      text-align: center;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 16px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #5b2eea, #16a34a);
      color: #fff;
      font-weight: 1000;
      font-size: 34px;
      letter-spacing: -0.06em;
      box-shadow: 0 14px 28px rgba(91, 46, 234, 0.22);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #eef2ff;
      color: #5b2eea;
      padding: 8px 13px;
      font-weight: 950;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 8vw, 44px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 auto 14px;
      color: #64748b;
      font-size: 17px;
      line-height: 1.45;
      font-weight: 750;
    }

    .notice {
      margin-top: 18px;
      padding: 14px;
      border-radius: 20px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #92400e;
      font-weight: 850;
    }

    small {
      display: block;
      margin-top: 16px;
      color: #94a3b8;
      font-weight: 750;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">CS</div>
    <span class="badge">Acceso pausado</span>
    <h1>Conecta Servicios no está disponible</h1>
    <p>Esta aplicación está en revisión interna y por ahora no está abierta al público.</p>
    <div class="notice">El acceso público fue pausado temporalmente por seguridad.</div>
    <small>© 2026 Conecta Servicios. Todos los derechos reservados.</small>
  </main>
</body>
</html>
