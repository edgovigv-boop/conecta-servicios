plugins {
    id 'com.android.application'
}

android {
    namespace 'com.conectaservicios.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.conectaservicios.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
