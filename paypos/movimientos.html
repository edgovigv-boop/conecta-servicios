<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paypos Movimientos</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#172033}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7ed,#f8fafc 40%,#ecfdf5);padding:14px}main{max-width:840px;margin:auto}.top{display:flex;gap:10px;justify-content:space-between}.pill,a.pill{background:white;border:1px solid #e5e7eb;border-radius:999px;padding:12px 15px;color:#5b2eea;text-decoration:none;font-weight:950;box-shadow:0 10px 24px #0001}.box{background:white;border:1px solid #e8edf3;border-radius:28px;padding:16px;margin:12px 0;box-shadow:0 18px 42px #0f172a1a}.logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#d6a94b,#8b5424);color:white;font-weight:1000;font-style:italic;display:grid;place-items:center}.brand{display:flex;gap:12px;align-items:center}.k{color:#64748b;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:1000;margin:0}h1{font-size:32px;margin:2px 0 5px}h2{margin:0 0 10px}.m{color:#64748b;font-weight:800}.grid,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.tile,.row{border:1px solid #e2e8f0;border-radius:20px;padding:12px;background:#fff}.stat span{display:block;color:#64748b;font-size:12px;font-weight:950;text-transform:uppercase}.stat strong{font-size:24px}.good{background:#ecfdf5!important;border-color:#86efac!important}.warn{background:#fff7ed!important;border-color:#fed7aa!important}.bad{background:#fff1f2!important;border-color:#fecdd3!important}.tile{text-align:left;font-weight:950;min-height:88px}.tile small,.row small{display:block;color:#64748b;font-weight:850;margin-top:4px}.ico{font-size:28px;display:block}.input{width:100%;min-height:118px;border:2px solid #dbe4ef;border-radius:22px;padding:14px;font-size:18px;font-weight:800}.big,.soft{width:100%;border:0;border-radius:18px;padding:14px;margin-top:10px;font-weight:1000;font-size:16px}.big{background:#16a34a;color:white}.soft{background:#eef2ff;color:#3730a3}.danger{background:#fff1f2!important;color:#be123c!important}.chips{display:flex;gap:8px;overflow:auto;padding-top:9px}.chip{white-space:nowrap;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:999px;padding:10px 12px;font-weight:950}.list{display:grid;gap:9px;max-height:430px;overflow:auto}.empty{color:#64748b;font-weight:900;text-align:center;border:1px dashed #cbd5e1;border-radius:18px;padding:18px}.foot{text-align:center;color:#64748b;font-size:12px;font-weight:850;padding:12px}@media(max-width:430px){.grid,.stats{grid-template-columns:1fr}h1{font-size:29px}.top{align-items:stretch}.pill{flex:1}}</style></head><body><main id="app"></main><script>(()=>{const K='paypos_movimientos_v1';const seed={items:[['efectivo','Efectivo','$',0,1],['pay_limon','Pay limón','pza',0,25],['arroz','Arroz','pza',0,25],['leche','Leche','pza',0,0],['media_crema','Media crema','pza',0,0],['limon','Limón','pza',0,0],['deuda','Deuda clientes','$',0,1],['acreedores','Acreedores','$',0,1],['activos','Activos','$',0,1]].map(x=>({id:x[0],name:x[1],unit:x[2],qty:x[3],value:x[4]})),moves:[]};let s=load();const app=document.getElementById('app'),mx=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}),no=n=>Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:2}),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(16).slice(2);function load(){try{return {...seed,...JSON.parse(localStorage.getItem(K)||'{}')}}catch{return JSON.parse(JSON.stringify(seed))}}function save(){localStorage.setItem(K,JSON.stringify(s))}function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\bpays\b/g,'pay')}function item(id){return s.items.find(x=>x.id===id)}function find(name){let n=norm(name);return s.items.find(i=>n.includes(norm(i.name))||n.includes(norm(i.id.replace('_',' ')))||n.includes(norm(i.id)))}function amt(t){let m=String(t).match(/[-+]?\d+(?:[\.,]\d+)?/);return m?Number(m[0].replace(',','.')):0}function moneyIn(t){let m=String(t).match(/\$\s*([-+]?\d+(?:[\.,]\d+)?)/);return m?Number(m[1].replace(',','.')):0}function apply(title,lines){let parts=[];lines.forEach(l=>{let it=item(l.id);if(!it)return;it.qty=Number(it.qty||0)+Number(l.qty||0);parts.push((l.qty>0?'+':'')+no(l.qty)+' '+it.name)});s.moves.push({id:uid(),date:new Date().toISOString(),title,lines:parts});save();render()}function summary(){let ef=item('efectivo').qty,inv=s.items.filter(i=>!['efectivo','deuda','acreedores','activos'].includes(i.id)).reduce((a,i)=>a+(i.qty*i.value),0),deu=item('deuda').qty,acr=item('acreedores').qty,act=item('activos').qty;return{ef,inv,deu,acr,act,total:ef+inv+deu+act-acr}}function setInitial(){let txt=prompt('Pega lista actual. Ej:\nEfectivo 50\nPay limon 28\nLeche 2\nArroz 0','Efectivo 0\nPay limon 0\nArroz 0\nLeche 0\nMedia crema 0\nLimon 0');if(!txt)return;txt.split(/\n+/).forEach(line=>{let it=find(line);if(it){let m=line.match(/[-+]?\d+(?:[\.,]\d+)?\s*$/);if(m)it.qty=Number(m[0].replace(',','.'))}});s.moves.push({id:uid(),date:new Date().toISOString(),title:'Lista inicial actualizada',lines:txt.split(/\n+/)});save();render()}function sale(){let q=Number(prompt('¿Cuántos pays limón vendiste?','2')||0);if(!q)return;apply('Venta pay limón',[{id:'pay_limon',qty:-q},{id:'efectivo',qty:q*25}])}function produce(){let q=Number(prompt('¿Cuántos pays limón preparaste?','30')||0);if(!q)return;let factor=q/30;apply('Producción pay limón',[{id:'pay_limon',qty:q},{id:'leche',qty:-0.5*factor},{id:'media_crema',qty:-0.3*factor},{id:'limon',qty:-0.2*factor}])}function purchase(){let it=choose('¿Qué compraste o ajustaste?');if(!it)return;let q=Number(prompt('¿Cuánto entra de '+it.name+'?','1')||0);if(!q)return;let cash=moneyIn(prompt('¿Cuánto pagaste en efectivo? Ej $80. Deja 0 si no aplica.','$0')||'0');let arr=[{id:it.id,qty:q}];if(cash)arr.push({id:'efectivo',qty:-cash});apply('Compra / entrada '+it.name,arr)}function arqueo(){let it=choose('¿Qué contaste físicamente?');if(!it)return;let counted=Number(prompt('Sistema esperaba '+no(it.qty)+' '+it.unit+'. ¿Cuánto contaste?',String(it.qty))||0);let diff=counted-Number(it.qty||0);if(confirm('Diferencia '+(diff>0?'+':'')+no(diff)+' '+it.name+'. ¿Registrar ajuste?'))apply('Arqueo '+it.name,[{id:it.id,qty:diff}])}function debt(id,label){let q=Number(prompt(label+' ¿monto?','0')||0);if(q)apply(label,[{id,q}])}function choose(msg){let ans=prompt(msg+'\n'+s.items.map((i,n)=>(n+1)+'. '+i.name).join('\n'),'1');return s.items[Number(ans)-1]||find(ans)}function parse(){let txt=document.getElementById('txt').value.trim();if(!txt)return;let lines=[];txt.split(/\n+/).forEach(line=>{let n=norm(line),it=find(line),v=amt(line);if(!it)return;if(n.includes('debe')&&!n.includes('debo'))it=item('deuda');if(n.includes('debo'))it=item('acreedores');lines.push({id:it.id,qty:v})});if(!lines.length){let n=norm(txt);if(/vendi|venta/.test(n)){let q=amt(txt)||1;lines=[{id:'pay_limon',qty:-q},{id:'efectivo',qty:q*25}]}else if(/prepare|preparé|hice|produje/.test(n)){let q=amt(txt)||30, f=q/30;lines=[{id:'pay_limon',qty:q},{id:'leche',qty:-0.5*f},{id:'media_crema',qty:-0.3*f},{id:'limon',qty:-0.2*f}]}}if(!lines.length)return alert('No entendí el movimiento. Usa formato +50 efectivo o -2 pay limón.');apply('Movimiento escrito',lines);document.getElementById('txt').value=''}function report(){let r=summary();let txt='Paypos - Lista actual\nEfectivo '+no(r.ef)+'\nPay limon '+no(item('pay_limon').qty)+'\nArroz '+no(item('arroz').qty)+'\nLeche '+no(item('leche').qty)+'\nMedia crema '+no(item('media_crema').qty)+'\nLimon '+no(item('limon').qty)+'\nDeuda '+mx(item('deuda').qty)+'\nAcreedores '+mx(item('acreedores').qty)+'\nActivos '+mx(item('activos').qty)+'\n\nÚltimos movimientos:\n'+s.moves.slice(-10).map(m=>'- '+m.title+': '+m.lines.join(', ')).join('\n');if(navigator.share)navigator.share({text:txt}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(txt);alert('Reporte copiado')}}function reset(){if(confirm('¿Borrar prueba local?')){localStorage.removeItem(K);s=load();render()}}function render(){let r=summary();app.innerHTML='<div class="top"><a class="pill" href="./pos.html">← POS</a><button class="pill" data-a="report">📤 Reporte</button></div><section class="box"><div class="brand"><div class="logo">Paypos</div><div><p class="k">Control por movimientos</p><h1>Lista actual</h1><p class="m">Todo lo que tiene valor se suma o se resta: efectivo, inventario, deuda, acreedores y activos.</p></div></div></section><section class="stats"><div class="stat good"><span>Efectivo</span><strong>'+mx(r.ef)+'</strong></div><div class="stat"><span>Inventario valor</span><strong>'+mx(r.inv)+'</strong></div><div class="stat"><span>Deuda clientes</span><strong>'+mx(r.deu)+'</strong></div><div class="stat bad"><span>Acreedores</span><strong>'+mx(r.acr)+'</strong></div><div class="stat"><span>Activos</span><strong>'+mx(r.act)+'</strong></div><div class="stat good"><span>Valor neto</span><strong>'+mx(r.total)+'</strong></div></section><section class="box"><h2>Lista actual tipo Excel</h2><div class="list">'+s.items.map(i=>'<div class="row"><b>'+esc(i.name)+'</b><small>'+no(i.qty)+' '+esc(i.unit)+' · valor unitario '+mx(i.value)+'</small></div>').join('')+'</div><button class="soft" data-a="initial">Pegar lista inicial / actual</button></section><section class="box"><h2>Movimientos rápidos</h2><div class="grid"><button class="tile good" data-a="sale"><span class="ico">💰</span><b>Venta</b><small>-Pay +Efectivo</small></button><button class="tile" data-a="produce"><span class="ico">🍰</span><b>Producción</b><small>+Pay -Insumos</small></button><button class="tile warn" data-a="purchase"><span class="ico">🛒</span><b>Compra / entrada</b><small>+Insumo -Efectivo</small></button><button class="tile" data-a="audit"><span class="ico">✅</span><b>Arqueo</b><small>Esperado vs contado</small></button><button class="tile" data-a="receivable"><span class="ico">🧾</span><b>Deuda</b><small>Cliente debe</small></button><button class="tile bad" data-a="payable"><span class="ico">🤝</span><b>Acreedor</b><small>Yo debo</small></button></div></section><section class="box"><h2>Escribir movimiento</h2><textarea id="txt" class="input" placeholder="Ej:\n-2 pay limon\n+50 efectivo"></textarea><button class="big" data-a="parse">Aplicar movimiento</button><div class="chips">'+['-2 pay limon\n+50 efectivo','+30 pay limon\n-0.5 leche\n-0.3 media crema\n-0.2 limon','+2.5 leche','Ana me debe +150'].map(x=>'<button class="chip" data-ex="'+esc(x)+'">'+esc(x).replace(/\n/g,' / ')+'</button>').join('')+'</div></section><section class="box"><h2>Historial</h2><div class="list">'+(s.moves.slice().reverse().slice(0,30).map(m=>'<div class="row"><b>'+esc(m.title)+'</b><small>'+new Date(m.date).toLocaleString('es-MX')+'</small><p>'+esc(m.lines.join(', '))+'</p></div>').join('')||'<div class="empty">Sin movimientos.</div>')+'</div><button class="soft danger" data-a="reset">Limpiar prueba local</button></section><div class="foot">© 2026 Conecta Servicios · Paypos por movimientos.</div>'}document.addEventListener('click',e=>{let b=e.target.closest('[data-a],[data-ex]');if(!b)return;if(b.dataset.ex){document.getElementById('txt').value=b.dataset.ex;return}({initial:setInitial,sale,produce,purchase,audit:arqueo,receivable:()=>debt('deuda','Deuda de cliente'),payable:()=>debt('acreedores','Acreedor / debo'),parse,report,reset}[b.dataset.a]||(()=>{}))()});render()})();</script></body></html>
