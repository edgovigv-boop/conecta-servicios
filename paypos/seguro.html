<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Sección no disponible</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at top left, rgba(91, 46, 234, 0.12), transparent 34%),
        linear-gradient(180deg, #fff7ed, #f8fafc 42%, #eef2ff);
    }

    main {
      width: min(100%, 520px);
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 22px 54px rgba(15, 23, 42, 0.14);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #eef2ff;
      color: #5b2eea;
      padding: 8px 13px;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(28px, 8vw, 40px);
      line-height: 1;
    }

    p {
      margin: 0 auto 18px;
      color: #64748b;
      font-size: 17px;
      line-height: 1.45;
      font-weight: 750;
    }

    a {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 52px;
      margin-top: 8px;
      border-radius: 18px;
      background: #5b2eea;
      color: #ffffff;
      text-decoration: none;
      font-weight: 950;
      font-size: 16px;
    }

    small {
      display: block;
      margin-top: 14px;
      color: #94a3b8;
      font-weight: 750;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Pruebas internas</span>
    <h1>Sección no disponible</h1>
    <p>Esta sección está en pruebas internas y no está disponible para usuarios.</p>
    <a href="/">Volver al inicio</a>
    <small>Conecta Servicios</small>
  </main>
  <script>
    window.addEventListener('pageshow', function () {
      try {
        localStorage.removeItem('paypos_email_seguro');
        localStorage.removeItem('paypos_token_seguro');
      } catch (error) {}
    });
  </script>
</body>
</html>
