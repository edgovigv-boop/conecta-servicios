<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paypos Excel</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#172033}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7ed,#f8fafc 42%,#ecfdf5);padding:14px}main{max-width:880px;margin:auto}.top{display:flex;gap:10px;justify-content:space-between}.pill,a.pill{background:white;border:1px solid #e5e7eb;border-radius:999px;padding:12px 15px;color:#5b2eea;text-decoration:none;font-weight:950;box-shadow:0 10px 24px #0001}.box{background:white;border:1px solid #e8edf3;border-radius:28px;padding:16px;margin:12px 0;box-shadow:0 18px 42px #0f172a1a}.brand{display:flex;gap:12px;align-items:center}.logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#d6a94b,#8b5424);color:white;font-weight:1000;font-style:italic;display:grid;place-items:center}.k{color:#64748b;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:1000;margin:0}h1{font-size:32px;margin:2px 0 5px}h2{margin:0 0 10px}.m{color:#64748b;font-weight:800}.stats,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.tile,.row{border:1px solid #e2e8f0;border-radius:20px;padding:12px;background:#fff}.stat span{display:block;color:#64748b;font-size:12px;font-weight:950;text-transform:uppercase}.stat strong{font-size:24px}.good{background:#ecfdf5!important;border-color:#86efac!important}.warn{background:#fff7ed!important;border-color:#fed7aa!important}.bad{background:#fff1f2!important;border-color:#fecdd3!important}.tile{text-align:left;font-weight:950;min-height:88px}.tile small,.row small{display:block;color:#64748b;font-weight:850;margin-top:4px}.ico{font-size:28px;display:block}.input{width:100%;min-height:118px;border:2px solid #dbe4ef;border-radius:22px;padding:14px;font-size:18px;font-weight:800}.big,.soft{width:100%;border:0;border-radius:18px;padding:14px;margin-top:10px;font-weight:1000;font-size:16px}.big{background:#16a34a;color:white}.soft{background:#eef2ff;color:#3730a3}.danger{background:#fff1f2!important;color:#be123c!important}.chips{display:flex;gap:8px;overflow:auto;padding-top:9px}.chip{white-space:nowrap;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:999px;padding:10px 12px;font-weight:950}.list{display:grid;gap:9px;max-height:520px;overflow:auto}.tag{display:inline-block;border-radius:999px;background:#eef2ff;color:#3730a3;padding:3px 8px;font-size:12px;font-weight:950;margin-left:4px}.empty{color:#64748b;font-weight:900;text-align:center;border:1px dashed #cbd5e1;border-radius:18px;padding:18px}.foot{text-align:center;color:#64748b;font-size:12px;font-weight:850;padding:12px}@media(max-width:430px){.grid,.stats{grid-template-columns:1fr}h1{font-size:29px}.top{align-items:stretch}.pill{flex:1}}</style></head><body><main id="app"></main><script>(()=>{const K='paypos_excel_v1';const catalog=[['efectivo','Efectivo','cash','$',17008,1],['pay_limon','Pay limón','finished','pza',228,25],['pay_queso','Pay queso','finished','pza',41,25],['pay_arroz','Pay arroz','finished','pza',70,25],['pay_fresas','Pay fresas','finished','pza',33,25],['pay_fresas_grandes','Pay fresas grandes','finished','pza',0,35],['crema_mezclada','Crema mezclada','finished','g',-0.535,124.33],['galleta','Galleta','raw','pz',-5.405,52],['leche','Leche','raw','pz',10.123,43],['lechera','Lechera','raw','pz',514.067,22.35],['lechera_s','Lechera S','raw','pz',0,null],['mcrema','MCrema','raw','pz',-0.815,65],['vainilla','Vainilla','raw','pz',0.504,42],['grenetina','Grenetina','raw','pz',1.011,245.1],['pasas','Pasas','raw','g',0.218,120],['crema_batida','Crema batida','raw','pz',7,79],['queso','Queso','raw','pz',1.230,159],['limon','Limón','raw','kg',-3.502,20],['fresa','Fresa','raw','kg',-0.064,70],['arroz','Arroz','raw','kg',0.496,22.8],['canela_b','Canela b','raw','g',0,46],['canela_p','Canela P','raw','g',2.031,35],['splenda','Splenda','raw','pz',0,0.371],['gas','Gas','expense','$',188.13,1],['stickers','Stickers','pack','pz',1449,0.643],['vasos','Vasos','pack','pz',12.35,18.6],['tapas','Tapas','pack','pz',14.16,32.2],['cucharas','Cucharas','pack','pz',111.96,8.817],['vaso_grande','Vaso grande','pack','pz',0,70],['tapa_grande','Tapa grande','pack','pz',0.42,40],['charolas','Charolas','pack','pz',0,20],['bolsas_neg','Bolsas neg','pack','pz',0,43],['microdyn','Microdyn','clean','pz',0,84],['desinfectante','Desinfectante','clean','g',1.222,84],['pinol','Pinol','clean','g',0,0],['cloro','Cloro','clean','pz',0,0],['roma','Roma','clean','g',0,0],['bolsa_basura','Bolsa de basura','clean','pz',0,0],['jabon_trastes','Jabón de trastes','clean','pz',0,0],['esponjas','Esponjas','clean','pz',0,0],['fibras','Fibras','clean','pz',0,0],['jabon_manos','Jabón de manos','clean','g',0,0],['suavitel','Suavitel','clean','g',0,0],['limpiavidrios','Limpiavidrios','clean','g',0,0],['agua','Agua','clean','pz',0,0],['papel_higienico','Papel higiénico','clean','pz',0,0],['clientes','Clientes que deben','receivable','$',32,1],['acreedores','Acreedores','payable','$',0,1],['tarjetas','Tarjetas','payable','$',-73972,1],['empleados','Empleados','payable','$',-1275,1],['gerente','Gerente','payable','$',-5009,1],['renta','Renta','expense','$',-3501.92,1],['gasolina','Gasolina','expense','$',-1310,1],['sams','Sams','expense','$',613.93,1],['luz','Luz','expense','$',-389.49,1],['activos','Activos','asset','$',28700,1],['auto','Auto','asset','$',120000,1],['deposito','Depósito','asset','$',8300,1]].map(x=>({id:x[0],name:x[1],type:x[2],unit:x[3],qty:x[4],value:x[5]}));const recipes={pay_limon:{name:'Pay limón',yield:18,lines:[['galleta',-0.6822],['leche',-0.65],['lechera',-2.6133],['mcrema',-0.32],['limon',-0.56],['stickers',-18],['vasos',-0.9],['tapas',-0.36],['cucharas',-0.36],['pay_limon',18]]},pay_queso:{name:'Pay queso',yield:15,lines:[['galleta',-0.2],['leche',-1.15],['lechera',-0.5333],['mcrema',-0.25],['grenetina',-0.02],['vainilla',-0.008],['queso',-0.2059],['stickers',-15],['vasos',-0.75],['tapas',-0.3],['cucharas',-0.3],['pay_queso',15]]},pay_arroz:{name:'Pay arroz',yield:35,lines:[['leche',-3],['lechera',-4],['canela_p',-0.0004],['vainilla',-0.03],['arroz',-0.9],['pasas',-0.14],['stickers',-35],['vasos',-1.75],['tapas',-0.7],['cucharas',-0.7],['pay_arroz',35]]},pay_fresas:{name:'Pay fresas',yield:1,lines:[['crema_batida',-0.0222],['fresa',-0.065],['desinfectante',-0.001],['stickers',-1],['vasos',-0.05],['tapas',-0.02],['cucharas',-0.02],['pay_fresas',1]]},pay_fresas_grandes:{name:'Pay fresas grandes',yield:1,lines:[['crema_batida',-0.0667],['fresa',-0.195],['desinfectante',-0.0029],['stickers',-1],['vaso_grande',-0.04],['tapa_grande',-0.02],['cucharas',-0.02],['pay_fresas_grandes',1]]},crema_mezclada:{name:'Crema mezclada',yield:1,lines:[['crema_batida',-1],['lechera',-2],['vainilla',-0.015],['crema_mezclada',1]]}};let s=load();const app=document.getElementById('app'),mx=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}),no=n=>Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:3}),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(16).slice(2);function load(){try{return JSON.parse(localStorage.getItem(K)||'null')||{items:JSON.parse(JSON.stringify(catalog)),moves:[]}}catch{return{items:JSON.parse(JSON.stringify(catalog)),moves:[]}}}function save(){localStorage.setItem(K,JSON.stringify(s))}function item(id){return s.items.find(i=>i.id===id)}function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\bpays\b/g,'pay')}function find(t){let n=norm(t);return s.items.find(i=>n.includes(norm(i.name))||n.includes(norm(i.id.replaceAll('_',' ')))||norm(i.name).includes(n))}function amount(t){let m=String(t).match(/[-+]?\d+(?:[\.,]\d+)?/);return m?Number(m[0].replace(',','.')):0}function apply(title,lines){let shown=[];lines.forEach(l=>{let it=item(l[0]);if(it){it.qty=Number(it.qty||0)+Number(l[1]||0);shown.push((l[1]>0?'+':'')+no(l[1])+' '+it.name)}});s.moves.push({id:uid(),date:new Date().toISOString(),title,lines:shown});save();render()}function summary(){let ef=item('efectivo').qty,prod=s.items.filter(i=>i.type==='finished').reduce((a,i)=>a+i.qty*(i.value||0),0),raw=s.items.filter(i=>['raw','pack','clean'].includes(i.type)).reduce((a,i)=>a+i.qty*(i.value||0),0),rec=item('clientes').qty,pay=s.items.filter(i=>['payable'].includes(i.type)).reduce((a,i)=>a+i.qty,0),assets=s.items.filter(i=>i.type==='asset').reduce((a,i)=>a+i.qty,0);return{ef,prod,raw,rec,pay,assets,total:ef+prod+raw+rec+assets+pay}}function sell(){let p=choose('Producto vendido',i=>i.type==='finished');if(!p)return;let q=Number(prompt('¿Cuántos vendiste de '+p.name+'?','1')||0);if(!q)return;apply('Venta '+p.name,[[p.id,-q],['efectivo',q*(p.value||0)]])}function produce(){let keys=Object.keys(recipes),ans=prompt('¿Qué preparaste?\n'+keys.map((k,i)=>(i+1)+'. '+recipes[k].name).join('\n'),'1'),key=keys[Number(ans)-1]||keys.find(k=>norm(recipes[k].name).includes(norm(ans)));let r=recipes[key];if(!r)return;let q=Number(prompt('¿Cuántos '+r.name+' preparaste?',String(r.yield))||0);if(!q)return;let f=q/r.yield;apply('Producción '+r.name,r.lines.map(x=>[x[0],x[1]*f]))}function buy(){let it=choose('¿Qué compraste o entró?',i=>!['finished','cash'].includes(i.type));if(!it)return;let q=Number(prompt('¿Cuánto entra de '+it.name+'?','1')||0);let paid=Number((prompt('¿Cuánto pagaste en efectivo?','0')||'0').replace('$',''));let lines=[[it.id,q]];if(paid)lines.push(['efectivo',-paid]);apply('Compra '+it.name,lines)}function audit(){let it=choose('¿Qué contaste físicamente?',()=>true);if(!it)return;let c=Number(prompt('Sistema esperaba '+no(it.qty)+' '+it.unit+'. ¿Cuánto contaste?',String(it.qty))||0);let d=c-Number(it.qty||0);if(confirm('Diferencia '+(d>0?'+':'')+no(d)+' '+it.name+'. ¿Registrar ajuste?'))apply('Arqueo '+it.name,[[it.id,d]])}function add(){let name=prompt('Nombre del nuevo elemento');if(!name)return;let type=prompt('Tipo: raw, pack, clean, finished, expense, payable, asset','raw')||'raw';let unit=prompt('Unidad: pza, kg, g, $, ml','pza')||'pza';let val=Number(prompt('Valor unitario o 0','0')||0);s.items.push({id:norm(name).replace(/\s+/g,'_'),name,type,unit,qty:0,value:val});save();render()}function choose(msg,filter){let arr=s.items.filter(filter||(()=>true));let ans=prompt(msg+'\n'+arr.map((i,n)=>(n+1)+'. '+i.name).join('\n'),'1');return arr[Number(ans)-1]||find(ans)}function parse(){let txt=document.getElementById('txt').value.trim();if(!txt)return;let lines=[];txt.split(/\n+/).forEach(line=>{let it=find(line),q=amount(line);if(it&&q)lines.push([it.id,q])});if(!lines.length){let n=norm(txt);if(/vendi|venta/.test(n)){let p=find(txt)||item('pay_limon'),q=amount(txt)||1;lines=[[p.id,-q],['efectivo',q*(p.value||0)]]}else if(/prepare|preparé|hice|produje/.test(n)){produce();return}}if(!lines.length)return alert('No entendí. Usa +2 leche o -2 pay limón.');apply('Movimiento escrito',lines);document.getElementById('txt').value=''}function report(){let r=summary();let txt='Paypos Excel inteligente\nEfectivo '+mx(r.ef)+'\nProductos '+mx(r.prod)+'\nInsumos '+mx(r.raw)+'\nClientes '+mx(r.rec)+'\nAcreedores '+mx(r.pay)+'\nActivos '+mx(r.assets)+'\nTotal '+mx(r.total)+'\n\nLista actual:\n'+s.items.map(i=>'- '+i.name+': '+no(i.qty)+' '+i.unit).join('\n');if(navigator.share)navigator.share({text:txt}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(txt);alert('Reporte copiado')}}function reset(){if(confirm('¿Reiniciar con datos extraídos de Excel?')){localStorage.removeItem(K);s=load();render()}}function render(){let r=summary(), groups={finished:'Productos',raw:'Materias primas',pack:'Empaques',clean:'Limpieza',expense:'Gastos',payable:'Acreedores',asset:'Activos',cash:'Caja',receivable:'Clientes'};app.innerHTML='<div class="top"><a class="pill" href="./movimientos.html">← Movimientos</a><button class="pill" data-a="report">📤 Reporte</button></div><section class="box"><div class="brand"><div class="logo">Paypos</div><div><p class="k">Excel inteligente</p><h1>Catálogo real</h1><p class="m">Precarga tomada de TT10.xlsx: productos, insumos, empaques, limpieza, gastos, acreedores y activos.</p></div></div></section><section class="stats"><div class="stat good"><span>Efectivo</span><strong>'+mx(r.ef)+'</strong></div><div class="stat"><span>Productos</span><strong>'+mx(r.prod)+'</strong></div><div class="stat"><span>Insumos</span><strong>'+mx(r.raw)+'</strong></div><div class="stat"><span>Clientes</span><strong>'+mx(r.rec)+'</strong></div><div class="stat bad"><span>Acreedores</span><strong>'+mx(r.pay)+'</strong></div><div class="stat good"><span>Valor neto</span><strong>'+mx(r.total)+'</strong></div></section><section class="box"><h2>Botones principales</h2><div class="grid"><button class="tile good" data-a="sell"><span class="ico">💰</span><b>Venta</b><small>-producto +efectivo</small></button><button class="tile" data-a="produce"><span class="ico">🍰</span><b>Producción</b><small>receta automática</small></button><button class="tile warn" data-a="buy"><span class="ico">🛒</span><b>Compra</b><small>+insumo -efectivo</small></button><button class="tile" data-a="audit"><span class="ico">✅</span><b>Arqueo</b><small>esperado vs contado</small></button><button class="tile" data-a="add"><span class="ico">➕</span><b>Agregar</b><small>nuevo elemento</small></button><button class="tile good" data-a="report"><span class="ico">📤</span><b>Corte</b><small>WhatsApp</small></button></div></section><section class="box"><h2>Escribir movimiento</h2><textarea id="txt" class="input" placeholder="Ej:\n-2 pay limón\n+50 efectivo"></textarea><button class="big" data-a="parse">Aplicar</button><div class="chips">'+['-2 pay limón\n+50 efectivo','+18 pay limón\n-0.682 galleta\n-0.65 leche','+2.5 leche','-80 efectivo\n+1 galleta'].map(x=>'<button class="chip" data-ex="'+esc(x)+'">'+esc(x).replace(/\n/g,' / ')+'</button>').join('')+'</div></section><section class="box"><h2>Lista actual</h2><div class="list">'+s.items.map(i=>'<div class="row"><b>'+esc(i.name)+' <span class="tag">'+esc(groups[i.type]||i.type)+'</span></b><small>'+no(i.qty)+' '+esc(i.unit)+' · valor '+(i.value==null?'pendiente':mx(i.value))+'</small></div>').join('')+'</div></section><section class="box"><h2>Historial</h2><div class="list">'+(s.moves.slice().reverse().slice(0,25).map(m=>'<div class="row"><b>'+esc(m.title)+'</b><small>'+new Date(m.date).toLocaleString('es-MX')+'</small><p>'+esc(m.lines.join(', '))+'</p></div>').join('')||'<div class="empty">Sin movimientos.</div>')+'</div><button class="soft danger" data-a="reset">Reiniciar catálogo extraído</button></section><div class="foot">© 2026 Conecta Servicios · Paypos basado en TT10.xlsx.</div>'}document.addEventListener('click',e=>{let b=e.target.closest('[data-a],[data-ex]');if(!b)return;if(b.dataset.ex){document.getElementById('txt').value=b.dataset.ex;return}({sell,produce,buy,audit,add,parse,report,reset}[b.dataset.a]||(()=>{}))()});render()})();</script></body></html>
