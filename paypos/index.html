*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7ed,#f8fafc 38%,#ecfdf5);color:var(--ink);padding:calc(env(safe-area-inset-top) + 10px) 12px 24px}.app{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.pill{min-height:42px;border-radius:999px;padding:0 14px;background:white;border:1px solid #e5e7eb;color:var(--purple);font-weight:950;box-shadow:0 10px 24px rgba(15,23,42,.07);text-decoration:none;display:flex;align-items:center;justify-content:center}button{cursor:pointer}.hero,.panel{background:white;border:1px solid var(--line);border-radius:30px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.hero-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:96px;height:96px;border-radius:24px;object-fit:cover;box-shadow:0 10px 24px rgba(15,23,42,.12)}.kicker{margin:0;color:#64748b;font-weight:1000;letter-spacing:.07em;text-transform:uppercase;font-size:12px}.brand-title{margin:2px 0 0;font-size:20px;font-weight:950;color:#172033}.guide{border:1px solid #c7d2fe;background:#eef2ff;border-radius:20px;padding:10px 12px;color:#3730a3;text-decoration:none;font-weight:950;min-width:142px}.guide span{display:block;font-size:30px}.guide small{display:block;color:#64748b}.hero p{font-size:18px;color:#64748b;font-weight:850;line-height:1.35}.stats,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.tile{background:white;border:1px solid #e2e8f0;border-radius:24px;padding:13px;box-shadow:0 10px 24px rgba(15,23,42,.06)}.stat.good{background:#ecfdf5;border-color:#86efac}.stat.warn{background:#fff7ed;border-color:#fed7aa}.stat span{display:block;color:#64748b;font-size:12px;font-weight:950;text-transform:uppercase}.stat strong{font-size:26px}.tile{text-align:left;min-height:98px}.tile.active{background:#ecfdf5;border-color:#86efac}.tile .ico{font-size:32px;display:block}.tile strong{display:block;font-size:18px}.tile small{color:#64748b;font-weight:850}.input{width:100%;min-height:112px;border:2px solid #dbe4ef;border-radius:24px;padding:14px;font-size:18px;font-weight:800}.big,.soft{width:100%;border:0;border-radius:20px;padding:15px;margin-top:10px;font-weight:1000;font-size:17px}.big{background:#16a34a;color:white}.soft{background:#eef2ff;color:#3730a3}.send{background:#25d366!important;color:white!important}.danger{background:#fff1f2!important;color:#be123c!important;border:1px solid #fecdd3}.chips{display:flex;gap:8px;overflow:auto;padding-top:9px}.chip{border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:999px;padding:10px 12px;font-weight:950;white-space:nowrap}.history{display:grid;gap:9px;max-height:420px;overflow:auto}.record{border:1px solid #e2e8f0;background:#f8fafc;border-radius:18px;padding:11px}.record b{display:block}.record p{margin:5px 0;color:#334155}.record small{color:#64748b;font-weight:850}.empty{text-align:center;color:#64748b;font-weight:900;padding:18px;border:1px dashed #cbd5e1;border-radius:20px}.footer{text-align:center;color:#64748b;font-weight:850;font-size:12px;padding:12px}@media(max-width:390px){.stats,.grid{grid-template-columns:1fr}.hero-head{align-items:flex-start}.logo{width:84px;height:84px}.guide{min-width:132px}}
</style>

const products=[
{name:'Pay de limón',price:25,aliases:['limon','limón','pay limon','pay de limon','pays de limon']},
{name:'Arroz con leche',price:25,aliases:['arroz','arroz con leche']},
{name:'Pay de queso',price:25,aliases:['queso','pay queso','pay de queso']},
{name:'Fresas con crema',price:35,aliases:['fresas','fresa','fresas con crema']}
];
const baseBtns=[
['RECETA','📖','Recetas','Fórmulas','nota'],['VENTA','💰','Ventas','Vendí','entrada'],['COMPRA','🛒','Compras','Compré','salida'],['PRODUCCION','🍰','Producción','Produje','nota'],['INVENTARIO','📦','Inventario','Qué tengo','nota'],['CONTROL','⚠️','Control del día','Resumen','nota'],['MERMA','⚠️','Mermas','Se perdió','salida'],['PEDIDO','📋','Pedidos','Me encargaron','pendiente'],['ANTICIPO','💵','Anticipos','Me adelantaron','entrada'],['DEUDA','🧾','Me deben','Falta cobrar','pendiente'],['EMPLEADO','👥','Empleados','Pagué ayuda','salida']
].map(x=>({key:x[0],icon:x[1],label:x[2],short:x[3],flow:x[4]}));
const app=document.getElementById('app');
const $=id=>document.getElementById(id);
const get=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const money=v=>Number(v||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\bpays\b/g,'pay');
function recs(){return get(KEY,[])}
function custom(){return get(CUSTOM,[])}
function day(){return new Date().toISOString().slice(0,10)}
function parseQty(x){return ({un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10}[norm(x).trim()]||Number(String(x).replace(',','.'))||1)}
function items(msg){let t=norm(msg),out=[];products.forEach(p=>{let names=[p.name,...p.aliases].map(norm);let found=names.find(a=>t.includes(a));if(found){let q=1;let safe=found.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');let m=t.match(new RegExp('(\\d+|un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\\s+(?:de\\s+)?'+safe));if(m)q=parseQty(m[1]);out.push({name:p.name,qty:q,price:p.price,total:q*p.price})}});return out}
function monto(m){let x=String(m).match(/\$\s*(\d+(?:[\.,]\d+)?)/);if(x)return Number(x[1].replace(',','.'));let nums=String(m).match(/\d+(?:[\.,]\d+)?/g)||[];return nums.length?Number(nums[nums.length-1].replace(',','.')):0}
function intent(m){let t=norm(m);if(/anticipo|adelanto|abono|mitad/.test(t))return'ANTICIPO';if(/debe|deben|fiado|saldo|resto/.test(t))return'DEUDA';if(/emplead|ayudante|pague a|le di/.test(t))return'EMPLEADO';if(/merma|regale|perdi|sobro|echaron a perder/.test(t))return'MERMA';if(/pedido|encargo|pidieron/.test(t))return'PEDIDO';if(/produje|produccion|hice|prepare/.test(t))return'PRODUCCION';if(/inventario|tengo|quedan/.test(t))return'INVENTARIO';if(/compre|gaste|pague|renta|luz|gas/.test(t))return'COMPRA';if(/vendi|venta|ventas|salieron|cobre/.test(t))return'VENTA';return'CONTROL'}
function def(k){return [...baseBtns,...custom()].find(b=>b.key===k)||{key:k,icon:'📝',label:'Nota',short:'',flow:'nota'}}
function saveMsg(m){let type=intent(m),d=def(type),it=items(m),total=0,status='ok';if(['VENTA','MERMA','PEDIDO'].includes(type))total=it.reduce((s,i)=>s+i.total,0)||monto(m);else if(['COMPRA','EMPLEADO','ANTICIPO','DEUDA'].includes(type))total=monto(m);if(['VENTA','COMPRA','EMPLEADO','ANTICIPO','DEUDA','MERMA'].includes(type)&&!total)status='pending';let r={id:Date.now()+Math.random(),date:new Date().toISOString(),day:day(),type,label:d.label,icon:d.icon,flow:d.flow,msg:m,total,items:it,status,response:status==='pending'?'Falta monto o cantidad.':d.label+' guardado'+(total?': '+money(total):'')+'.'};set(KEY,[...recs(),r])}
function sum(){let all=recs(),ok=all.filter(r=>r.day===day()&&r.status!=='pending'),flow=f=>ok.filter(r=>r.flow===f).reduce((s,r)=>s+Number(r.total||0),0),sold={};ok.filter(r=>r.type==='VENTA').forEach(r=>(r.items||[]).forEach(i=>sold[i.name]=(sold[i.name]||0)+i.qty));let top=Object.entries(sold).sort((a,b)=>b[1]-a[1])[0];return{all,entra:flow('entrada'),sale:flow('salida'),deben:all.filter(r=>r.type==='DEUDA').reduce((s,r)=>s+Number(r.total||0),0),anti:ok.filter(r=>r.type==='ANTICIPO').reduce((s,r)=>s+Number(r.total||0),0),top:top?top[0]+' ('+top[1]+')':'Sin ventas'}}
function reportText(){let s=sum();return 'Paypos - Reporte de hoy\n\nEntró: '+money(s.entra)+'\nSalió: '+money(s.sale)+'\nMe quedó: '+money(s.entra-s.sale)+'\nMe deben: '+money(s.deben)+'\nAnticipos: '+money(s.anti)+'\nMás vendido: '+s.top+'\n\nMovimientos:\n'+(s.all.slice(-12).map(r=>'- '+r.msg+' ('+r.response+')').join('\n')||'Sin movimientos.')}
function sendReport(){let txt=reportText();let url='https://wa.me/?text='+encodeURIComponent(txt);window.open(url,'_blank');setTimeout(()=>{if(navigator.clipboard)navigator.clipboard.writeText(txt)},300)}
function render(){let s=sum(),btns=[...baseBtns,...custom()];app.innerHTML='<div class="top"><a class="pill" href="/">← Conecta</a><button class="pill" data-send>📤 Enviar reporte</button></div><section class="hero"><div class="hero-head"><div class="brand"><img class="logo" src="'+logo+'"><div><p class="kicker">Conecta Control</p><div class="brand-title">Control diario de Paypos</div></div></div><a class="guide" href="guia.html"><span>🎬</span>Guía rápida<small>Orden del día</small></a></div><p>Orden sugerido: guía, recetas, inventario, compras, producción, ventas y control del día.</p></section><section class="stats"><div class="stat good"><span>Entró</span><strong>'+money(s.entra)+'</strong></div><div class="stat warn"><span>Salió</span><strong>'+money(s.sale)+'</strong></div><div class="stat good"><span>Me quedó</span><strong>'+money(s.entra-s.sale)+'</strong></div><div class="stat"><span>Me deben</span><strong>'+money(s.deben)+'</strong></div><div class="stat"><span>Anticipos</span><strong>'+money(s.anti)+'</strong></div><div class="stat"><span>Más vendido</span><strong>'+esc(s.top)+'</strong></div></section><section class="panel"><h2>Botones rápidos</h2><div class="grid">'+btns.map(b=>'<button class="tile '+(b.key==='RECETA'?'active':'')+'" data-btn="'+b.key+'"><span class="ico">'+b.icon+'</span><strong>'+b.label+'</strong><small>'+b.short+'</small></button>').join('')+'<button class="tile active" data-add><span class="ico">➕</span><strong>Otro</strong><small>Agregar botón</small></button></div></section><section class="panel"><h2>Escribir o dictar</h2><textarea class="input" id="msg" placeholder="Ej: Vendí 3 pays de limón"></textarea><button class="big" data-save>Guardar</button><div class="chips">'+['Vendí 3 pays de limón','Compré leche $80','Pagué a María $300','Merma 2 arroz','Me dieron anticipo $200','Ana me debe $150'].map(x=>'<button class="chip" data-ex="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div></section><section class="panel"><h2>Hoy</h2><div class="history">'+(s.all.slice().reverse().slice(0,30).map(r=>'<div class="record"><b>'+esc(r.icon)+' '+esc(r.label)+'</b><p>'+esc(r.msg)+'</p><small>'+esc(r.response)+'</small></div>').join('')||'<div class="empty">Aún no hay movimientos.</div>')+'</div><button class="soft send" data-send>📤 Enviar reporte por WhatsApp</button><button class="soft" data-copy>Copiar resumen</button><button class="soft danger" data-clear>Limpiar prueba</button></section><div class="footer">© 2026 Conecta Servicios. App piloto Paypos.</div>'}
document.addEventListener('click',e=>{let b=e.target.closest('[data-btn],[data-save],[data-ex],[data-add],[data-clear],[data-copy],[data-send]');if(!b)return;if(b.dataset.btn==='RECETA')location.href='recetas.html';else if(b.dataset.btn){let map={VENTA:'Vendí ',COMPRA:'Compré ',PRODUCCION:'Hice ',INVENTARIO:'Inventario ',CONTROL:'Resumen: ',MERMA:'Merma ',PEDIDO:'Pedido: ',ANTICIPO:'Me dieron anticipo ',DEUDA:'Me deben ',EMPLEADO:'Pagué a '};$('msg').value=map[b.dataset.btn]||'';$('msg').focus()}else if(b.dataset.ex){$('msg').value=b.dataset.ex;$('msg').focus()}else if(b.hasAttribute('data-save')){let m=$('msg').value.trim();if(m){saveMsg(m);render()}}else if(b.hasAttribute('data-add')){let label=prompt('Nombre del botón');if(label){let flow=prompt('¿entra, sale o nota?','sale');let id='CUSTOM:'+Date.now();set(CUSTOM,[...custom(),{key:id,icon:flow==='entra'?'💵':flow==='nota'?'⭐':'💸',label,short:'Mi botón',flow:flow==='entra'?'entrada':flow==='sale'?'salida':'nota'}]);render()}}else if(b.hasAttribute('data-clear')){if(confirm('¿Borrar registros de prueba?')){localStorage.removeItem(KEY);render()}}else if(b.hasAttribute('data-copy')){let txt=reportText();navigator.clipboard?navigator.clipboard.writeText(txt).then(()=>alert('Resumen copiado.')):prompt('Copia:',txt)}else if(b.hasAttribute('data-send'))sendReport()});render();
})();
</script></body></html>
