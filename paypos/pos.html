<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paypos POS</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#172033}*{box-sizing:border-box}body{margin:0;padding:14px;background:linear-gradient(180deg,#fff7ed,#f8fafc 40%,#ecfdf5)}main{max-width:820px;margin:auto}.top{display:flex;gap:10px;justify-content:space-between}.pill,a.pill{background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:12px 15px;color:#5b2eea;text-decoration:none;font-weight:950;box-shadow:0 10px 24px #0001}.card,.panel{background:#fff;border:1px solid #e8edf3;border-radius:28px;padding:16px;margin:12px 0;box-shadow:0 18px 42px #0f172a1a}.brand{display:flex;gap:12px;align-items:center}.logo{width:82px;height:82px;border-radius:24px;background:linear-gradient(135deg,#d6a94b,#8b5424);color:#fff;font-size:20px;font-style:italic;font-weight:1000;display:flex;align-items:center;justify-content:center}.k{color:#64748b;font-size:12px;letter-spacing:.07em;font-weight:1000;text-transform:uppercase;margin:0}h1{font-size:34px;margin:2px 0 6px}h2{margin:0 0 10px;font-size:24px}.m{color:#64748b;font-weight:800;line-height:1.35}.stats,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.btn,.item{border:1px solid #e2e8f0;border-radius:22px;padding:13px;background:#fff;box-shadow:0 10px 24px #0000000d}.stat span{display:block;color:#64748b;font-size:12px;font-weight:950;text-transform:uppercase}.stat strong{font-size:25px}.good{background:#ecfdf5!important;border-color:#86efac!important}.warn{background:#fff7ed!important;border-color:#fed7aa!important}.bad{background:#fff1f2!important;border-color:#fecdd3!important}.btn{text-align:left;min-height:98px;font-weight:950}.btn small,.item small{display:block;color:#64748b;font-weight:850;margin-top:4px}.ico{display:block;font-size:31px}.input{width:100%;min-height:105px;border:2px solid #dbe4ef;border-radius:22px;padding:14px;font-size:18px;font-weight:800}.big,.soft{width:100%;border:0;border-radius:20px;padding:14px;margin-top:10px;font-weight:1000;font-size:16px}.big{background:#16a34a;color:#fff}.soft{background:#eef2ff;color:#3730a3}.danger{background:#fff1f2!important;color:#be123c!important}.list{display:grid;gap:9px;max-height:430px;overflow:auto}.chips{display:flex;gap:8px;overflow:auto;padding-top:9px}.chip{white-space:nowrap;border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:999px;padding:10px 12px;font-weight:950}.empty{text-align:center;color:#64748b;font-weight:900;padding:18px;border:1px dashed #cbd5e1;border-radius:18px}.foot{text-align:center;color:#64748b;font-weight:850;font-size:12px;padding:12px}@media(max-width:430px){.stats,.grid{grid-template-columns:1fr}h1{font-size:30px}.top{align-items:stretch}.pill{flex:1}}</style></head><body><main id="app"></main><script>(()=>{const KEY='paypos_pos_v2';const base={cash0:0,products:[['limon','Pay de limón',25,0],['queso','Pay de queso',25,0],['arroz','Arroz con leche',25,0],['fresas','Fresas con crema',35,0]].map(x=>({id:x[0],name:x[1],price:x[2],stock:x[3]})),records:[],receivables:[],payables:[],assets:[]};let st=load();const $=id=>document.getElementById(id),mx=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}),no=n=>Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(16).slice(2);function load(){try{return {...base,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return JSON.parse(JSON.stringify(base))}}function save(){localStorage.setItem(KEY,JSON.stringify(st))}function rec(label,detail,amount=0,cash='none',extra={}){st.records.push({id:uid(),date:new Date().toISOString(),label,detail,amount:Number(amount||0),cash,...extra});save();render()}function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\bpays\b/g,'pay')}function moneyInText(t){let m=String(t).match(/\$\s*(\d+(?:[\.,]\d+)?)/);if(m)return +m[1].replace(',','.');let a=String(t).match(/\d+(?:[\.,]\d+)?/g)||[];return a.length?+a[a.length-1].replace(',','.'):0}function qty(t){let m=norm(t).match(/\d+(?:[\.,]\d+)?|un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez/);return m?({un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10}[m[0]]||+m[0].replace(',','.')):1}function prod(t){let n=norm(t);return st.products.find(p=>[p.name,p.id,'pay '+p.id,'pay de '+p.id].map(norm).some(a=>n.includes(a)))}function sum(){let cashIn=st.records.filter(r=>r.cash==='in').reduce((s,r)=>s+r.amount,0),cashOut=st.records.filter(r=>r.cash==='out').reduce((s,r)=>s+r.amount,0),sales=st.records.filter(r=>r.kind==='sale').reduce((s,r)=>s+r.total,0),recb=st.receivables.filter(x=>x.balance>0).reduce((s,x)=>s+x.balance,0),payb=st.payables.filter(x=>x.balance>0).reduce((s,x)=>s+x.balance,0),inv=st.products.reduce((s,p)=>s+p.stock*p.price,0);let sold={};st.records.filter(r=>r.kind==='sale').forEach(r=>sold[r.product]=(sold[r.product]||0)+r.qty);let top=Object.entries(sold).sort((a,b)=>b[1]-a[1])[0];return{cashIn,cashOut,sales,expected:st.cash0+cashIn-cashOut,recb,payb,inv,top:top?top[0]+' ('+top[1]+')':'Sin ventas'}}function sale(p){let q=+(prompt('¿Cuántos vendiste de '+p.name+'?','1')||0);if(!q)return;let total=q*p.price,paid=+(prompt('Total '+mx(total)+'. ¿Cuánto pagaron?',String(total))||0);p.stock-=q;if(paid>0)rec('Venta',q+' '+p.name,paid,'in',{kind:'sale',product:p.name,qty:q,total});if(total-paid>0){let name=prompt('¿Quién quedó debiendo?','Cliente')||'Cliente';st.receivables.push({id:uid(),name,detail:q+' '+p.name,balance:total-paid})}save();render()}function stock(p){let q=+(prompt('¿Cuántos hay físicamente de '+p.name+'?',String(p.stock))||0);p.stock=q;rec('Inventario','Ajuste '+p.name+': '+q,0,'none')}function produce(){let p=choose('¿Qué preparaste?');if(!p)return;let q=+(prompt('¿Cuántos preparaste?','1')||0);if(!q)return;p.stock+=q;rec('Producción','Preparé '+q+' '+p.name,0,'none')}function expense(){let d=prompt('¿Qué compraste o pagaste?','Compra de insumos');if(!d)return;let a=moneyInText(prompt('¿Cuánto salió?','$0')||'');if(a)rec('Gasto / compra',d,a,'out')}function opening(){st.cash0=moneyInText(prompt('¿Con cuánto efectivo inició caja?',String(st.cash0))||'0');rec('Caja inicial',mx(st.cash0),0,'none')}function close(){let s=sum(),c=moneyInText(prompt('Esperado '+mx(s.expected)+'. ¿Cuánto contaste?',String(s.expected))||'0'),d=c-s.expected;rec('Arqueo','Esperado '+mx(s.expected)+' · Contado '+mx(c)+' · Dif. '+mx(d),0,'none');alert(d===0?'Caja cuadrada ✅':'Diferencia '+mx(d))}function debt(){let n=prompt('¿Quién te debe?','Cliente');if(!n)return;let a=moneyInText(prompt('¿Cuánto debe?','$0')||'0');if(!a)return;let d=prompt('¿Por qué?','Pedido pendiente')||'';st.receivables.push({id:uid(),name:n,detail:d,balance:a});rec('Me deben',n+' · '+d+' · '+mx(a),0,'none');save();render()}function payable(){let n=prompt('¿A quién debes?','Proveedor');if(!n)return;let a=moneyInText(prompt('¿Cuánto debes?','$0')||'0');if(!a)return;let d=prompt('¿Por qué?','Compra pendiente')||'';st.payables.push({id:uid(),name:n,detail:d,balance:a});rec('Acreedor',n+' · '+d+' · '+mx(a),0,'none');save();render()}function asset(){let n=prompt('Activo/equipo','Horno');if(!n)return;let v=moneyInText(prompt('Valor aproximado','$0')||'0');st.assets.push({id:uid(),name:n,value:v});rec('Activo',n+' · '+mx(v),0,'none');save();render()}function payR(id,arr,cash){let x=arr.find(y=>y.id===id);if(!x)return;let a=moneyInText(prompt('¿Cuánto se pagó?',String(x.balance))||'0');x.balance=Math.max(0,x.balance-a);rec(cash==='in'?'Cobro':'Pago',x.name+' · '+mx(a),a,cash);save();render()}function choose(msg){let ans=prompt(msg+'\n'+st.products.map((p,i)=>i+1+'. '+p.name).join('\n'),'1');return st.products[+ans-1]||prod(ans)}function text(){let m=$('msg').value.trim();if(!m)return;let t=norm(m),p=prod(m),q=qty(m),a=moneyInText(m);if(/vendi|venta|salieron/.test(t)&&p){p.stock-=q;rec('Venta',q+' '+p.name,a||q*p.price,'in',{kind:'sale',product:p.name,qty:q,total:q*p.price})}else if(/hice|prepare|produje/.test(t)&&p){p.stock+=q;rec('Producción',m,0,'none')}else if(/compre|gaste|pague/.test(t)){rec('Gasto / compra',m,a,'out')}else if(/me debe|me deben/.test(t)){st.receivables.push({id:uid(),name:'Cliente',detail:m,balance:a});rec('Me deben',m,0,'none')}else if(/debo/.test(t)){st.payables.push({id:uid(),name:'Acreedor',detail:m,balance:a});rec('Acreedor',m,0,'none')}else rec('Nota',m,0,'none');$('msg').value='';save();render()}function reportText(){let s=sum();return 'Paypos POS - Corte\nEfectivo esperado: '+mx(s.expected)+'\nVentas: '+mx(s.sales)+'\nMe deben: '+mx(s.recb)+'\nDebo: '+mx(s.payb)+'\nInventario valor: '+mx(s.inv)+'\nMás vendido: '+s.top+'\n\nInventario:\n'+st.products.map(p=>'- '+p.name+': '+no(p.stock)).join('\n')}async function report(){let txt=reportText();if(navigator.share)try{await navigator.share({text:txt});return}catch{}if(navigator.clipboard)await navigator.clipboard.writeText(txt);alert('Reporte copiado para pegar en WhatsApp.')}function reset(){if(confirm('¿Borrar prueba local?')){localStorage.removeItem(KEY);st=load();render()}}function render(){let s=sum();app.innerHTML='<div class="top"><a class="pill" href="/">← Conecta</a><button class="pill" data-a="report">📤 Reporte</button></div><section class="card"><div class="brand"><div class="logo">Paypos</div><div><p class="k">Conecta Control POS</p><h1>Punto de venta</h1><p class="m">Efectivo, inventario, deudas, acreedores, activos y arqueo.</p></div></div></section><section class="stats"><div class="stat good"><span>Efectivo esperado</span><strong>'+mx(s.expected)+'</strong></div><div class="stat warn"><span>Ventas</span><strong>'+mx(s.sales)+'</strong></div><div class="stat"><span>Inventario valor</span><strong>'+mx(s.inv)+'</strong></div><div class="stat"><span>Me deben</span><strong>'+mx(s.recb)+'</strong></div><div class="stat bad"><span>Debo</span><strong>'+mx(s.payb)+'</strong></div><div class="stat"><span>Más vendido</span><strong>'+esc(s.top)+'</strong></div></section><section class="panel"><h2>Venta rápida</h2><div class="grid">'+st.products.map(p=>'<button class="btn good" data-sale="'+p.id+'"><span class="ico">🥧</span><strong>'+esc(p.name)+'</strong><small>'+mx(p.price)+' · quedan '+no(p.stock)+'</small></button>').join('')+'</div></section><section class="panel"><h2>5 controles básicos</h2><div class="grid">'+[['opening','💵','Efectivo','Caja inicial'],['inventory','📦','Inventario','Ajustar'],['debt','🧾','Deuda','Me deben'],['payable','🤝','Acreedores','Debo'],['asset','🏪','Activos','Equipo'],['close','✅','Arqueo','Cuadre']].map(x=>'<button class="btn" data-a="'+x[0]+'"><span class="ico">'+x[1]+'</span><strong>'+x[2]+'</strong><small>'+x[3]+'</small></button>').join('')+'</div></section><section class="panel"><h2>Operación</h2><div class="grid"><button class="btn" data-a="produce"><span class="ico">🍰</span><strong>Producción</strong><small>Preparé</small></button><button class="btn warn" data-a="expense"><span class="ico">🛒</span><strong>Compra / gasto</strong><small>Salió dinero</small></button><button class="btn good" data-a="report"><span class="ico">📤</span><strong>Reporte</strong><small>Enviar</small></button><a class="btn" href="guia.html" style="color:inherit;text-decoration:none"><span class="ico">🎬</span><strong>Guía rápida</strong><small>Orden del día</small></a></div></section><section class="panel"><h2>Hablarle al negocio</h2><textarea id="msg" class="input" placeholder="Ej: Vendí 3 pays de limón"></textarea><button class="big" data-a="text">Guardar</button><div class="chips">'+['Vendí 3 pays de limón','Compré vasos $80','Hice 10 fresas con crema','Ana me debe $150','Debo proveedor $500'].map(x=>'<button class="chip" data-ex="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div></section><section class="panel"><h2>Inventario</h2><div class="list">'+st.products.map(p=>'<div class="item"><b>'+esc(p.name)+'</b><small>Quedan '+no(p.stock)+' · '+mx(p.price)+'</small><button class="soft" data-stock="'+p.id+'">Ajustar</button></div>').join('')+'</div></section><section class="panel"><h2>Deudas y acreedores</h2><div class="list">'+[...st.receivables.filter(x=>x.balance>0).map(x=>'<div class="item"><b>Me debe '+esc(x.name)+'</b><small>'+esc(x.detail)+' · '+mx(x.balance)+'</small><button class="soft" data-pr="'+x.id+'">Registrar pago</button></div>'),...st.payables.filter(x=>x.balance>0).map(x=>'<div class="item"><b>Debo a '+esc(x.name)+'</b><small>'+esc(x.detail)+' · '+mx(x.balance)+'</small><button class="soft" data-pp="'+x.id+'">Registrar pago</button></div>')].join('')||'<div class="empty">Sin pendientes.</div>'+'</div></section><section class="panel"><h2>Últimos movimientos</h2><div class="list">'+(st.records.slice().reverse().slice(0,30).map(r=>'<div class="item"><b>'+esc(r.label)+'</b><p>'+esc(r.detail)+'</p><small>'+new Date(r.date).toLocaleString('es-MX')+(r.amount?' · '+mx(r.amount):'')+'</small></div>').join('')||'<div class="empty">Aún no hay movimientos.</div>')+'</div><button class="soft danger" data-a="reset">Limpiar prueba local</button></section><div class="foot">© 2026 Conecta Servicios · Paypos POS local-first.</div>'}document.addEventListener('click',e=>{let b=e.target.closest('[data-a],[data-sale],[data-stock],[data-ex],[data-pr],[data-pp]');if(!b)return;if(b.dataset.sale)return sale(st.products.find(p=>p.id===b.dataset.sale));if(b.dataset.stock)return stock(st.products.find(p=>p.id===b.dataset.stock));if(b.dataset.ex){$('msg').value=b.dataset.ex;$('msg').focus();return}if(b.dataset.pr)return payR(b.dataset.pr,st.receivables,'in');if(b.dataset.pp)return payR(b.dataset.pp,st.payables,'out');({opening,inventory:()=>{let p=choose('¿Qué inventario ajustar?');if(p)stock(p)},debt,payable,asset,close,produce,expense,text,report,reset}[b.dataset.a]||(()=>{}))()});render()})();</script></body></html>
