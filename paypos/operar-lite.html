<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operar Paypos</title><style>body{margin:0;padding:16px;background:#fff7ed;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#172033}.card{background:#fff;border:1px solid #e5e7eb;border-radius:26px;padding:16px;margin:12px 0;box-shadow:0 16px 36px #0001}.top{display:flex;gap:10px}.btn,a{display:block;border:0;border-radius:18px;padding:16px;margin:10px 0;font-size:18px;font-weight:900;text-decoration:none;text-align:left}.pill{background:#fff;color:#5b2eea;border:1px solid #e5e7eb}.green{background:#dcfce7;color:#166534}.orange{background:#ffedd5;color:#9a3412}.blue{background:#e0e7ff;color:#3730a3}.red{background:#fee2e2;color:#991b1b}.small{color:#64748b;font-weight:800}.msg{white-space:pre-wrap;border-radius:18px;padding:12px;background:#f8fafc;border:1px solid #e5e7eb;font-weight:800}select,input{width:100%;box-sizing:border-box;border:2px solid #dbe4ef;border-radius:16px;padding:14px;margin:8px 0;font-size:18px;font-weight:800}h1{font-size:34px;margin:4px 0}</style></head><body><main><div class="top"><a class="btn pill" href="/paypos/seguro.html?v=4">← Panel</a><button class="btn pill" onclick="load()">Actualizar</button></div><section class="card"><h1>Paypos Operar</h1><p class="small">Venta, compra, producción y arqueo. Usa tu sesión privada ya iniciada.</p><p id="msg" class="msg">Cargando...</p></section><section class="card"><button class="btn green" onclick="sale()">💰 Registrar venta</button><button class="btn orange" onclick="purchase()">🛒 Registrar compra</button><button class="btn blue" onclick="production()">🍰 Registrar producción</button><button class="btn red" onclick="audit()">✅ Arqueo de caja</button></section><section class="card" id="form"></section></main><script>const TK='paypos_token_seguro';let data=null;const $=id=>document.getElementById(id);function token(){return localStorage.getItem(TK)}function money(n){return Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0})}function opt(a){return (a||[]).map(x=>`<option value="${x.id}">${x.name}${x.price?' · '+money(x.price):''}</option>`).join('')}async function api(path,opts={}){const r=await fetch(path,{cache:'no-store',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const p=await r.json().catch(()=>({ok:false,error:'Respuesta no JSON'}));if(!r.ok||p.ok===false)throw new Error(p.error||('HTTP '+r.status));return p}async function load(){if(!token()){location.href='/paypos/seguro.html?v=4';return}try{data=await api('/api/paypos-snapshot',{headers:{Authorization:'Bearer '+token()}});const c=data.snapshot?.cash?.[0]?.calculated_expected_cash||0;$('msg').textContent='Sesión: '+(data.user?.email||'')+'\nCaja esperada: '+money(c)+'\nProductos: '+(data.products||[]).length+' · Insumos: '+(data.inventory_items||[]).length}catch(e){$('msg').textContent='Error: '+e.message}}async function save(action,payload){$('msg').textContent='Guardando movimiento...';try{await api('/api/paypos-operation',{method:'POST',headers:{Authorization:'Bearer '+token()},body:JSON.stringify({action,payload})});$('form').innerHTML='';await load();$('msg').textContent+='\n✅ Movimiento guardado.'}catch(e){$('msg').textContent='Error al guardar: '+e.message}}function sale(){const p=data.products||[];$('form').innerHTML='<h2>💰 Venta</h2><select id="p">'+opt(p)+'</select><input id="q" type="number" step="0.01" placeholder="Cantidad vendida"><input id="paid" type="number" step="0.01" placeholder="Cobró cuánto? vacío = total"><button class="btn green" id="s">Guardar venta</button>';$('s').onclick=()=>{const pr=p.find(x=>x.id===$('p').value);save('sale',{product_id:pr.id,quantity:$('q').value,unit_price:pr.price,paid_amount:$('paid').value,notes:'Venta desde Paypos'})}}function purchase(){const it=data.inventory_items||[];$('form').innerHTML='<h2>🛒 Compra</h2><select id="i">'+opt(it)+'</select><input id="q" type="number" step="0.01" placeholder="Cantidad que entró"><input id="cost" type="number" step="0.01" placeholder="Costo por unidad"><input id="paid" type="number" step="0.01" placeholder="Pagó cuánto? vacío = total"><button class="btn orange" id="s">Guardar compra</button>';$('s').onclick=()=>{const item=it.find(x=>x.id===$('i').value);save('purchase',{inventory_item_id:item.id,quantity:$('q').value,unit:item.unit,unit_cost:$('cost').value,paid_amount:$('paid').value,notes:'Compra desde Paypos'})}}function production(){const p=data.products||[];$('form').innerHTML='<h2>🍰 Producción</h2><select id="p">'+opt(p)+'</select><input id="q" type="number" step="0.01" placeholder="Cantidad preparada"><button class="btn blue" id="s">Guardar producción</button>';$('s').onclick=()=>save('production',{product_id:$('p').value,quantity:$('q').value,notes:'Producción desde Paypos'})}function audit(){$('form').innerHTML='<h2>✅ Arqueo</h2><input id="cash" type="number" step="0.01" placeholder="Efectivo contado físicamente"><button class="btn red" id="s">Guardar arqueo</button>';$('s').onclick=()=>save('cash_audit',{counted_cash:$('cash').value,notes:'Arqueo desde Paypos'})}load()</script></body></html>
